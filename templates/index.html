<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Booking</title>
</head>
<body>
    <h1>Ticket Booking Application</h1>
    <form id="bookingForm">
        <label for="name">Name:</label>
        <input type="text" id="name" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" required><br><br>
        <label for="event">Event:</label>
        <input type="text" id="event" required><br><br>
        <label for="seats">Seats:</label>
        <input type="number" id="seats" required><br><br>
        <button type="submit">Book Ticket</button>
    </form>
    <div id="message"></div>

    <h2>Booked Tickets Dashboard</h2>
    <div id="ticketsList">
        <p>Loading tickets...</p>
    </div>

    <script>
        async function loadTickets() {
            try {
                const response = await fetch('/tickets');
                const tickets = await response.json();
                const ticketsDiv = document.getElementById('ticketsList');
                if (tickets.length === 0) {
                    ticketsDiv.innerHTML = '<p>No tickets booked yet.</p>';
                } else {
                    let html = '<ul>';
                    tickets.forEach(ticket => {
                        html += `<li><strong>${ticket.name}</strong> - ${ticket.event} - ${ticket.seats} seats - ${ticket.email}</li>`;
                    });
                    html += '</ul>';
                    ticketsDiv.innerHTML = html;
                }
            } catch (error) {
                document.getElementById('ticketsList').innerHTML = '<p>Error loading tickets.</p>';
            }
        }

        document.getElementById('bookingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                event: document.getElementById('event').value,
                seats: parseInt(document.getElementById('seats').value)
            };
            const response = await fetch('/book', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await response.json();
            document.getElementById('message').innerText = result.message;
            // Clear form
            document.getElementById('bookingForm').reset();
            // Reload tickets
            loadTickets();
        });

        // Load tickets on page load
        window.onload = loadTickets;
    </script>
</body>
</html>
