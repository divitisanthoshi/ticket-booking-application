<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventBook - Ticket Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .hero {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 100px 0;
        }
        .event-card {
            transition: transform 0.3s;
            border: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .event-card:hover {
            transform: translateY(-5px);
        }
        .navbar-brand {
            font-weight: bold;
            font-size: 1.5rem;
        }
        .btn-book {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-book:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-calendar-alt"></i> EventBook</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#events">Events</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#my-tickets">My Tickets</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div class="container text-center">
            <h1 class="display-4">Discover Amazing Events</h1>
            <p class="lead">Book tickets for concerts, sports, theater, and more</p>
            <div class="row justify-content-center mt-4">
                <div class="col-md-6">
                    <input type="text" class="form-control form-control-lg" placeholder="Search events..." id="searchInput">
                </div>
            </div>
        </div>
    </section>

    <div class="container my-5">
        <h2 class="text-center mb-4" id="events">Upcoming Events</h2>
        <div class="row" id="eventsList">
            <!-- Events will be loaded here -->
        </div>
    </div>

    <!-- Booking Modal -->
    <div class="modal fade" id="bookingModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Book Ticket</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="bookingForm">
                        <div class="mb-3">
                            <label for="eventName" class="form-label">Event</label>
                            <input type="text" class="form-control" id="eventName" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="name" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="seats" class="form-label">Number of Seats</label>
                            <input type="number" class="form-control" id="seats" min="1" max="10" required>
                        </div>
                        <button type="submit" class="btn btn-book text-white w-100">Book Now</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="container my-5" id="my-tickets">
        <h2 class="text-center mb-4">My Booked Tickets</h2>
        <div id="ticketsList" class="row">
            <div class="col-12">
                <div class="alert alert-info">Loading your tickets...</div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4">
        <div class="container">
            <p>&copy; 2023 EventBook. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let events = [
            { id: 1, name: "Rock Concert 2023", date: "2023-12-15", venue: "Stadium A", price: 50, description: "An amazing rock concert featuring top bands." },
            { id: 2, name: "Jazz Night", date: "2023-12-20", venue: "Jazz Club", price: 30, description: "Relaxing jazz evening with live performances." },
            { id: 3, name: "Comedy Show", date: "2023-12-25", venue: "Theater B", price: 25, description: "Hilarious stand-up comedy by famous comedians." },
            { id: 4, name: "Sports Match", date: "2023-12-30", venue: "Arena C", price: 40, description: "Exciting football match between top teams." }
        ];

        function renderEvents(eventsToShow) {
            const eventsDiv = document.getElementById('eventsList');
            eventsDiv.innerHTML = '';
            eventsToShow.forEach(event => {
                const eventCard = `
                    <div class="col-md-6 col-lg-3 mb-4">
                        <div class="card event-card h-100">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title">${event.name}</h5>
                                <p class="card-text"><i class="fas fa-calendar"></i> ${event.date}</p>
                                <p class="card-text"><i class="fas fa-map-marker-alt"></i> ${event.venue}</p>
                                <p class="card-text"><i class="fas fa-dollar-sign"></i> $${event.price}</p>
                                <p class="card-text small">${event.description}</p>
                                <button class="btn btn-book text-white mt-auto" onclick="openBookingModal('${event.name}')">Book Now</button>
                            </div>
                        </div>
                    </div>
                `;
                eventsDiv.innerHTML += eventCard;
            });
        }

        function openBookingModal(eventName) {
            document.getElementById('eventName').value = eventName;
            new bootstrap.Modal(document.getElementById('bookingModal')).show();
        }

        async function loadTickets() {
            try {
                const response = await fetch('/tickets');
                const tickets = await response.json();
                const ticketsDiv = document.getElementById('ticketsList');
                if (tickets.length === 0) {
                    ticketsDiv.innerHTML = '<div class="col-12"><div class="alert alert-info">No tickets booked yet.</div></div>';
                } else {
                    let html = '';
                    tickets.forEach(ticket => {
                        html += `
                            <div class="col-md-6 col-lg-4 mb-3">
                                <div class="card">
                                    <div class="card-body">
                                        <h6 class="card-title">${ticket.event}</h6>
                                        <p class="card-text"><strong>${ticket.name}</strong></p>
                                        <p class="card-text">${ticket.email}</p>
                                        <p class="card-text"><i class="fas fa-users"></i> ${ticket.seats} seats</p>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    ticketsDiv.innerHTML = html;
                }
            } catch (error) {
                document.getElementById('ticketsList').innerHTML = '<div class="col-12"><div class="alert alert-danger">Error loading tickets.</div></div>';
            }
        }

        document.getElementById('bookingForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                event: document.getElementById('eventName').value,
                seats: parseInt(document.getElementById('seats').value)
            };
            try {
                const response = await fetch('/book', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                alert(result.message);
                bootstrap.Modal.getInstance(document.getElementById('bookingModal')).hide();
                document.getElementById('bookingForm').reset();
                loadTickets();
            } catch (error) {
                alert('Error booking ticket. Please try again.');
            }
        });

        document.getElementById('searchInput').addEventListener('input', function() {
            const query = this.value.toLowerCase();
            const filteredEvents = events.filter(event => event.name.toLowerCase().includes(query) || event.description.toLowerCase().includes(query));
            renderEvents(filteredEvents);
        });

        // Initialize
        renderEvents(events);
        loadTickets();
    </script>
</body>
</html>
